            <Row l={L('Tagihan', 'Bills')} v={`- ${formatRp(c.bl)}`} cls="text-warning" />
            <Row bold l={L('Surplus / Defisit', 'Surplus / Deficit')} v={formatRp(c.surplus)} cls={c.surplus < 0 ? 'text-expense' : ''} />
            <Row l={L('Setor tabungan target', 'Goal deposits')} v={`- ${formatRp(c.gl)}`} cls="text-accent" />
            <Row l={L('Top-up investasi', 'Investment top-ups')} v={`- ${formatRp(c.iv)}`} cls="text-invest" />
            <Row bold l={L('Perubahan Kas Bersih', 'Net Cash Change')} v={formatRp(c.net)} cls={c.net < 0 ? 'text-expense' : 'text-income'} />
            <p className="text-[9px] opacity-50 font-medium">{L('Transfer antar dompet tidak dihitung (netral).', 'Wallet transfers are excluded (neutral).')}</p>
          </Card>

          <Card icon="bar_chart" title={mode === 'year' ? L('Tren Bulanan', 'Monthly Trend') : L('Tren Harian', 'Daily Trend')}
            right={<div className="flex gap-2 text-[9px] font-bold opacity-70"><span className="flex items-center gap-1"><i className="w-2 h-2 rounded-sm inline-block" style={{ background: '#34C759' }}></i>{L('Masuk', 'In')}</span><span className="flex items-center gap-1"><i className="w-2 h-2 rounded-sm inline-block" style={{ background: '#FF3B30' }}></i>{L('Keluar', 'Out')}</span></div>}>
            <svg viewBox="0 0 320 130" className="w-full">
              <line x1="0" y1="110" x2="320" y2="110" stroke="currentColor" opacity="0.15" />
              {series.map(s => {
                const w = 320 / n, h1 = (s.inc / maxV) * 100, h2 = (s.out / maxV) * 100;
                const show = mode === 'year' || s.i === 0 || (s.i + 1) % 5 === 0;
                return (
                  <g key={s.i}>
                    <rect x={s.i * w + w * 0.1} y={110 - h1} width={w * 0.38} height={h1} rx="1.5" fill="#34C759" />
                    <rect x={s.i * w + w * 0.5} y={110 - h2} width={w * 0.38} height={h2} rx="1.5" fill="#FF3B30" />
                    {show && <text x={s.i * w + w / 2} y="124" fontSize="8" textAnchor="middle" fill="currentColor" opacity="0.5">{mode === 'year' ? MN[s.i].slice(0, 3) : s.i + 1}</text>}
                  </g>
                );
              })}
            </svg>
          </Card>

          <Card icon="donut_large" title={L('Distribusi Uang Keluar', 'Outflow Breakdown')}>
            {cats.length === 0 ? <p className="text-center opacity-50 text-[12px] py-4">{L('Belum ada data.', 'No data.')}</p> : (
              <>
                <div className="flex justify-center">
                  <svg viewBox="0 0 120 120" className="w-40 h-40">
                    {cats.map((k, i) => { const len = (k.v / totalOut) * CIRC; const el = <circle key={k.name} cx="60" cy="60" r={R} fill="none" stroke={CHART_COLORS[i % CHART_COLORS.length]} strokeWidth="18" strokeDasharray={`${len} ${CIRC - len}`} strokeDashoffset={-acc} transform="rotate(-90 60 60)" />; acc += len; return el; })}
                    <text x="60" y="57" textAnchor="middle" fontSize="7" fill="currentColor" opacity="0.5">TOTAL</text>
                    <text x="60" y="69" textAnchor="middle" fontSize="9" fontWeight="800" fill="currentColor">{formatRp(totalOut)}</text>
                  </svg>
                </div>
                <div className="space-y-2.5">
                  {cats.map((k, i) => (
                    <div key={k.name} className="space-y-1">
                      <div className="flex justify-between items-center text-[12px]">
                        <span className="font-bold flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: CHART_COLORS[i % CHART_COLORS.length] }}></i>{k.name}</span>
                        <span className="font-extrabold">{formatRp(k.v)} <span className="opacity-50 text-[10px]">{(k.v / totalOut * 100).toFixed(0)}%</span> {Dl(k.v, prevMap[k.name], false)}</span>
                      </div>
                      <Bar pct={(k.v / totalOut) * 100} color={CHART_COLORS[i % CHART_COLORS.length]} />
                    </div>
                  ))}
                </div>
              </>
            )}
          </Card>

          {budgets.length > 0 && (
            <Card icon="speed" title={L('Anggaran vs Realisasi', 'Budget vs Actual')}>
              {budgets.map(b => {
                const s = spentCat(b.category), lim = Number(b.limit) * months, pct = lim > 0 ? (s / lim) * 100 : 0;
                return (
                  <div key={b.id} className="space-y-1">
                    <div className="flex justify-between text-[12px]"><span className="font-bold">{b.category}</span><span className="font-extrabold">{formatRp(s)} <span className="opacity-50 text-[10px]">/ {formatRp(lim)}</span></span></div>
                    <Bar pct={pct} color={pct > 100 ? '#FF3B30' : pct > 80 ? '#FF9500' : '#34C759'} />
                    <p className={`text-[10px] font-bold ${lim - s < 0 ? 'text-expense' : 'opacity-50'}`}>{lim - s < 0 ? L('Lebih ', 'Over by ') : L('Sisa ', 'Left ')}{formatRp(Math.abs(lim - s))} • {pct.toFixed(0)}%</p>
                  </div>
                );
              })}
              <p className="text-[9px] opacity-50 font-medium">{L('Dihitung per bulan kalender.', 'Calculated per calendar month.')}</p>
            </Card>
          )}

          <Card icon="account_balance_wallet" title={L('Arus Kas per Dompet', 'Cash Flow by Wallet')}>
            {walletFlow.length === 0 ? <p className="text-center opacity-50 text-[12px]">-</p> : walletFlow.map(a => (
              <div key={a.id} className="bg-black/5 dark:bg-white/5 rounded-2xl p-3 space-y-1">
                <div className="flex justify-between text-[12px]"><span className="font-bold">{a.name}</span><span className="font-extrabold">{formatRp(snap.balances[a.id] || 0)}</span></div>
                <div className="flex justify-between text-[10px] font-bold"><span className="text-income">▲ {formatRp(a.i)}</span><span className="text-expense">▼ {formatRp(a.o)}</span></div>
              </div>
            ))}
          </Card>

          {Object.keys(byUser).length > 0 && (
            <Card icon="group" title={L('Per Pencatat', 'By Person')}>
              {Object.entries(byUser).map(([u, v]) => (
                <div key={u} className="space-y-1.5">
                  <p className="text-[12px] font-bold">{u}</p>
                  <div className="flex items-center gap-2 text-[10px] font-bold"><span className="w-14 text-income">{L('Masuk', 'In')}</span><div className="flex-1"><Bar pct={(v.inc / userMax) * 100} color="#34C759" /></div><span className="w-24 text-right">{formatRp(v.inc)}</span></div>
                  <div className="flex items-center gap-2 text-[10px] font-bold"><span className="w-14 text-expense">{L('Keluar', 'Out')}</span><div className="flex-1"><Bar pct={(v.out / userMax) * 100} color="#FF3B30" /></div><span className="w-24 text-right">{formatRp(v.out)}</span></div>
                </div>
              ))}
            </Card>
          )}

          {(goals.length > 0 || bills.length > 0) && (
            <Card icon="flag" title={L('Target & Tagihan', 'Goals & Bills')}>
              {goals.map(g => {
                const saved = transactions.filter(x => x.type === 'Goal' && x.goalId === g.id).reduce((s, x) => s + x.amount, 0);
                const add = cur.filter(x => x.type === 'Goal' && x.goalId === g.id).reduce((s, x) => s + x.amount, 0);
                const pct = g.target > 0 ? (saved / g.target) * 100 : 0;
                return (
                  <div key={g.id} className="space-y-1">
                    <div className="flex justify-between text-[12px]"><span className="font-bold">{g.name}</span><span className="font-extrabold text-accent">{formatRp(saved)} <span className="opacity-50 text-[10px]">/ {formatRp(g.target)}</span></span></div>
                    <Bar pct={pct} color="#007AFF" />
                    <p className="text-[10px] font-bold opacity-50">{pct.toFixed(0)}% • {L('periode ini', 'this period')} +{formatRp(add)}</p>
                  </div>
                );
              })}
              {bills.map(bl => {
                const paid = cur.filter(x => x.type === 'Bill' && x.billId === bl.id);
                const tot = paid.reduce((s, x) => s + x.amount, 0);
                return (
                  <div key={bl.id} className="flex justify-between items-center text-[12px]">
                    <span className="font-bold">{bl.name} <span className="opacity-50 text-[10px]">{formatRp(bl.amount)}</span></span>
                    <span className={`px-2 py-0.5 rounded-lg text-[10px] font-extrabold ${paid.length ? 'bg-income/15 text-income' : 'bg-warning/15 text-warning'}`}>{paid.length ? `${L('Dibayar', 'Paid')} ${paid.length}× • ${formatRp(tot)}` : L('Belum dibayar', 'Unpaid')}</span>
                  </div>
                );
              })}
            </Card>
          )}

          {investments.length > 0 && (
            <Card icon="trending_up" title={L('Portofolio Investasi', 'Investment Portfolio')}>
              {investments.map(inv => {
                const modal = transactions.filter(x => x.type === 'Investasi' && x.investmentId === inv.id).reduce((s, x) => s + x.amount, 0);
                const val = modal * (1 + Number(inv.mockReturnPct) / 100);
                return <div key={inv.id} className="flex justify-between text-[12px]"><span className="font-bold">{inv.name} <span className="opacity-50 text-[10px]">{inv.type}</span></span><span className="font-extrabold text-invest">{formatRp(val)} <span className="text-income text-[10px]">+{formatRp(val - modal)}</span></span></div>;
              })}
            </Card>
          )}

          {top5.length > 0 && (
            <Card icon="workspace_premium" title={L('5 Pengeluaran Terbesar', 'Top 5 Expenses')}>
              {top5.map((x, i) => (
                <div key={x.id} className="flex items-center gap-3">
                  <span className="w-6 h-6 rounded-full bg-expense/10 text-expense text-[11px] font-extrabold flex items-center justify-center">{i + 1}</span>
                  <div className="flex-1 min-w-0"><p className="text-[12px] font-bold truncate">{title(x)}</p><p className="text-[10px] opacity-50 font-semibold"><Chip type={x.type}>{x.category}</Chip> {fmtShortDate(x.date)}</p></div>
                  <span className="text-[12px] font-extrabold">{formatRp(x.amount)}</span>
                </div>
              ))}
            </Card>
          )}

          <Card icon="list_alt" title={L('Rincian Transaksi', 'Transactions')} right={<span className="text-[10px] font-bold opacity-50">{listTx.length}</span>}>
            {listTx.length === 0 && <p className="text-center opacity-50 text-[12px] py-3">{L('Belum ada transaksi.', 'No transactions.')}</p>}
            {(showAll ? listTx : listTx.slice(0, 15)).map(x => {
              const m = txMeta(x.type);
              return (
                <div key={x.id} className="flex items-center gap-3">
                  <div className={`w-8 h-8 rounded-[10px] flex items-center justify-center flex-shrink-0 ${m.badge}`}><span className="material-symbols-rounded text-[16px]">{x.icon || m.icon}</span></div>
                  <div className="flex-1 min-w-0"><p className="text-[12px] font-bold truncate">{title(x)}</p><p className="text-[10px] opacity-50 font-semibold"><Chip type={x.type}>{x.category}</Chip> {fmtShortDate(x.date)} • {x.creator}</p></div>
                  <span className={`text-[12px] font-extrabold whitespace-nowrap ${m.text}`}>{m.sign}{formatRp(x.amount)}</span>
                </div>
              );
            })}
            {listTx.length > 15 && <button onClick={() => setShowAll(!showAll)} className="w-full py-2 bg-accent/10 text-accent font-bold text-xs rounded-xl">{showAll ? L('Ringkas', 'Show less') : L(`Tampilkan semua (${listTx.length})`, `Show all (${listTx.length})`)}</button>}
          </Card>
        </div>
      );
    }

    function NavBtn({ icon, label, active, onClick }) {
      return (
        <div onClick={onClick} className={`flex flex-col items-center cursor-pointer w-[50px] transition-all duration-300 relative z-10 ${active ? 'text-accent font-bold scale-105' : 'opacity-40 hover:opacity-100'}`}>
          <span className={`material-symbols-rounded text-[24px] mb-0.5 ${active ? 'fill-current' : ''}`}>{icon}</span>
          <span className="text-[9px] font-bold tracking-widest">{label}</span>
        </div>
      );
    }

    function ManageAccountsModal({ isDark, t, accounts, onClose, onSave }) {
      const [localAccs, setLocalAccs] = useState([...accounts]);
      const [newName, setNewName] = useState('');
      const [newType, setNewType] = useState('Bank');
      const [saving, setSaving] = useState(false);

      const getIcon = (type) => {
        if (type === 'Bank') return 'account_balance';
        if (type === 'E-Wallet') return 'account_balance_wallet';
        return 'payments';
      };

      const handleAdd = () => {
        if (!newName.trim()) return;
        setLocalAccs([...localAccs, { id: 'a' + Date.now(), name: newName.trim(), type: newType, owner: 'Pribadi', icon: getIcon(newType) }]);
        setNewName('');
      };

      return (
        <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full max-w-[340px] max-h-[85%] rounded-[32px] p-6 shadow-2xl flex flex-col`}>
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-[18px] font-extrabold">{t.manageWallet}</h2>
              <button onClick={onClose} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
            </div>

            <div className="flex gap-2 mb-4">
              <select value={newType} onChange={e => setNewType(e.target.value)} className={`w-[90px] ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[12px] px-2 text-[11px] font-bold outline-none`}>
                <option value="Bank">Bank</option>
                <option value="E-Wallet">E-Wallet</option>
                <option value="Cash">Cash</option>
              </select>
              <input type="text" value={newName} onChange={e => setNewName(e.target.value)} placeholder="Nama Dompet..." className={`flex-1 ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[12px] px-3.5 text-xs font-bold outline-none`} />
              <button onClick={handleAdd} className="bg-accent text-white px-3 py-2 rounded-[12px] font-bold text-sm">+</button>
            </div>

            <div className="flex-1 overflow-y-auto no-scrollbar space-y-2">
              {localAccs.map(acc => (
                <div key={acc.id} className="p-3 bg-black/5 dark:bg-white/5 rounded-[14px] flex items-center justify-between gap-2">
                  <div className="flex items-center gap-3 flex-1">
                    <span className="material-symbols-rounded text-accent bg-accent/10 p-2 rounded-[10px] text-[16px]">{acc.icon}</span>
                    <input type="text" value={acc.name} onChange={e => setLocalAccs(localAccs.map(a => a.id === acc.id ? { ...a, name: e.target.value } : a))} className="w-full bg-transparent font-bold text-[13px] outline-none" />
                  </div>
                  <button onClick={() => { if (window.confirm(t.confirmDeleteWallet)) setLocalAccs(localAccs.filter(a => a.id !== acc.id)); }} className="text-expense p-1.5 hover:bg-expense/10 rounded-lg transition"><span className="material-symbols-rounded text-[16px]">delete</span></button>
                </div>
              ))}
              {localAccs.length === 0 && <p className="text-center opacity-50 py-4 text-[12px] italic">Belum ada dompet.</p>}
            </div>
            <button disabled={saving} onClick={async () => { setSaving(true); await onSave(localAccs); setSaving(false); }} className={`w-full bg-accent text-white font-extrabold text-[14px] py-3.5 rounded-[16px] mt-5 ${saving ? 'opacity-50' : ''}`}>{saving ? '...' : t.save}</button>
          </div>
        </div>
      );
    }

    function AddPlanModal({ isDark, t, planTab, expenseCats, onClose, onSave }) {
      const [name, setName] = useState(planTab === 'Budget' ? (expenseCats[0] || '') : '');
      const [subType, setSubType] = useState('Reksa Dana');
      const [val, setVal] = useState('');
      const [displayVal, setDisplayVal] = useState('');
      const inputClass = `w-full ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[16px] p-3.5 text-[14px] font-bold outline-none appearance-none`;

      return (
        <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-end">
          <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full rounded-t-[36px] p-6 pb-10 shadow-2xl`}>
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-[18px] font-extrabold">Add {planTab}</h2>
              <button onClick={onClose} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
            </div>
            <div className="space-y-3.5">
              {planTab === 'Budget' ? (
                <select value={name} onChange={e => setName(e.target.value)} className={inputClass}>
                  {expenseCats.map(c => <option key={c} value={c} className="text-black">{c}</option>)}
                </select>
              ) : (
                <input type="text" placeholder={planTab === 'Investasi' ? 'Nama Portofolio (cth: Tino)' : 'Name'} value={name} onChange={e => setName(e.target.value)} className={inputClass} />
              )}
              {planTab === 'Investasi' && (
                <select value={subType} onChange={e => setSubType(e.target.value)} className={inputClass}>
                  <option value="Reksa Dana">Reksa Dana</option>
                  <option value="Saham">Saham</option>
                  <option value="Obligasi">Obligasi / SBN</option>
                </select>
              )}
              <input type="text" inputMode={planTab === 'Investasi' ? 'decimal' : 'numeric'} placeholder={planTab === 'Investasi' ? 'Estimasi Return (%)' : 'Amount (Rp)'} value={planTab === 'Investasi' ? val : displayVal} onChange={planTab === 'Investasi' ? (e) => setVal(e.target.value.replace(',', '.')) : (e) => { const clean = e.target.value.replace(/\D/g, ''); setVal(clean); setDisplayVal(formatNumberInput(clean)); }} className={inputClass} />
              <button onClick={() => { const num = parseFloat(val); if (name.trim() && !isNaN(num)) onSave({ name: name.trim(), subType, val: num }); }} className="w-full bg-accent text-white font-extrabold text-[14px] py-3.5 rounded-[16px] mt-3">{t.save}</button>
            </div>
          </div>
        </div>
      );
    }

    function ManageCategoriesModal({ isDark, t, incomeCats, expenseCats, onClose, onSave }) {
      const [inc, setInc] = useState([...incomeCats]);
      const [exp, setExp] = useState([...expenseCats]);
      const [newCat, setNewCat] = useState('');
      const [type, setType] = useState('Expense');

      const addCat = () => {
        const c = newCat.trim();
        if (!c) return;
        if (type === 'Expense') { if (!exp.includes(c)) setExp([...exp, c]); }
        else { if (!inc.includes(c)) setInc([...inc, c]); }
        setNewCat('');
      };

      return (
        <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full max-w-[340px] max-h-[85%] rounded-[32px] p-6 shadow-2xl flex flex-col`}>
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-[18px] font-extrabold">{t.manageCat}</h2>
              <button onClick={onClose} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
            </div>
            <div className="flex gap-2 mb-3.5">
              <button onClick={() => setType('Expense')} className={`flex-1 py-2 rounded-[12px] text-xs font-bold ${type === 'Expense' ? 'bg-expense text-white' : 'bg-black/5 dark:bg-white/5'}`}>{t.expense}</button>
              <button onClick={() => setType('Income')} className={`flex-1 py-2 rounded-[12px] text-xs font-bold ${type === 'Income' ? 'bg-income text-white' : 'bg-black/5 dark:bg-white/5'}`}>{t.income}</button>
            </div>
            <div className="flex gap-2 mb-3.5">
              <input type="text" value={newCat} onChange={e => setNewCat(e.target.value)} placeholder="Kategori baru..." className={`flex-1 ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[12px] px-3.5 text-xs font-bold outline-none`} />
              <button onClick={addCat} className="bg-accent text-white px-3.5 py-2.5 rounded-[12px] font-bold text-sm">+</button>
            </div>
            <div className="flex-1 overflow-y-auto no-scrollbar space-y-2">
              {(type === 'Expense' ? exp : inc).map(c => (
                <div key={c} className="p-3 bg-black/5 dark:bg-white/5 rounded-[14px] flex justify-between items-center">
                  <span className="font-bold text-[13px]">{c}</span>
                  <button onClick={() => type === 'Expense' ? setExp(exp.filter(x => x !== c)) : setInc(inc.filter(x => x !== c))} className="text-expense"><span className="material-symbols-rounded text-[16px]">delete</span></button>
                </div>
              ))}
            </div>
            <button onClick={() => onSave(inc, exp)} className="w-full bg-accent text-white font-extrabold text-[14px] py-3.5 rounded-[16px] mt-5">{t.save}</button>
          </div>
        </div>
      );
    }

    function FormTransaction({ t, lang, isDark, accounts, incomeCats, expenseCats, goals, bills, investments, prefill, onClose, onSave }) {
      const optionsFor = (tp) => {
        if (tp === 'Expense') return expenseCats.map(c => ({ value: c, label: c }));
        if (tp === 'Income') return incomeCats.map(c => ({ value: c, label: c }));
        if (tp === 'Goal') return goals.map(g => ({ value: g.id, label: g.name }));
        if (tp === 'Bill') return bills.map(b => ({ value: b.id, label: b.name }));
        if (tp === 'Investasi') return investments.map(i => ({ value: i.id, label: i.name }));
        return [];
      };

      const initialType = prefill?.type || 'Expense';
      const initialRaw = prefill?.amount ? String(prefill.amount) : '';
      const [type, setType] = useState(initialType);
      const [rawAmount, setRawAmount] = useState(initialRaw);
      const [displayAmount, setDisplayAmount] = useState(formatNumberInput(initialRaw));
      const [accountId, setAccountId] = useState(accounts[0]?.id || '');
      const [toAccountId, setToAccountId] = useState(accounts[1]?.id || '');
      const [selection, setSelection] = useState(() => prefill?.goalId || prefill?.billId || prefill?.investmentId || prefill?.category || optionsFor(initialType)[0]?.value || '');
      const [desc, setDesc] = useState(prefill?.desc || '');
      const [saving, setSaving] = useState(false);

      const options = optionsFor(type);

      // Pastikan kategori selalu valid untuk jenis transaksi yang dipilih
      useEffect(() => {
        if (type !== 'Transfer' && options.length && !options.some(o => o.value === selection)) setSelection(options[0].value);
      }, [type, options.length]);

      const changeType = (tp) => {
        setType(tp);
        if (tp !== 'Transfer') setSelection(optionsFor(tp)[0]?.value || '');
      };

      const handleAmountChange = (e) => {
        const clean = e.target.value.replace(/\D/g, '');
        setRawAmount(clean);
        setDisplayAmount(formatNumberInput(clean));
      };

      const submit = async () => {
        if (saving) return;
        if (accounts.length === 0) { alert(t.noWalletAlert); return; }

        const num = parseFloat(rawAmount) || 0;
        if (num <= 0) return;

        const tx = { type, amount: num, accountId, desc, icon: txMeta(type).icon };

        if (type === 'Transfer') {
          if (accounts.length < 2) { alert(t.needTwoWallets); return; }
          if (!toAccountId || toAccountId === accountId) { alert(t.sameWallet); return; }
          const src = accounts.find(a => a.id === accountId);
          if (src && num > src.balance && !window.confirm(t.lowBalance)) return;
          tx.toAccountId = toAccountId;
          tx.category = 'Transfer';
        } else {
          if (!selection) { alert(t.chooseCat); return; }
          tx.category = options.find(o => o.value === selection)?.label || selection;
          if (type === 'Goal') tx.goalId = selection;
          if (type === 'Bill') tx.billId = selection;
          if (type === 'Investasi') tx.investmentId = selection;
        }

        setSaving(true);
        await onSave(tx);
        setSaving(false);
      };

      const inputClass = `w-full ${isDark ? 'bg-black/20 text-white' : 'bg-[#F2F2F7] text-[#1C1C1E]'} border-none rounded-[16px] p-3.5 text-[13px] font-bold outline-none appearance-none`;
      const walletOptions = accounts.map(a => <option key={a.id} value={a.id} className="text-black">{a.name} · {formatRp(a.balance)}</option>);

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center mb-1">
            <h2 className="text-[20px] font-extrabold">{t.addTx}</h2>
            <button onClick={onClose} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
          </div>

          <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            {[
              { id: 'Expense', label: t.expense, color: 'bg-expense' },
              { id: 'Income', label: t.income, color: 'bg-income' },
              { id: 'Transfer', label: t.transfer, color: 'bg-transfer' },
              { id: 'Goal', label: 'Goal', color: 'bg-accent' },
              { id: 'Bill', label: 'Bills', color: 'bg-warning' },
              { id: 'Investasi', label: 'Invest', color: 'bg-invest' }
            ].map(tb => (
              <button key={tb.id} onClick={() => changeType(tb.id)} className={`px-3 py-2 rounded-[12px] text-[10px] font-bold whitespace-nowrap transition-all ${type === tb.id ? `${tb.color} text-white shadow-md` : 'bg-black/5 dark:bg-white/5 opacity-60'}`}>
                {tb.label}
              </button>
            ))}
          </div>

          <div className="relative">
            <span className="absolute left-4 top-1/2 -translate-y-1/2 font-extrabold text-[20px] opacity-40">Rp</span>
            <input type="text" inputMode="numeric" placeholder="0" value={displayAmount} onChange={handleAmountChange} className={`${inputClass} pl-12 text-[24px] py-4 font-extrabold`} />
          </div>

          {type === 'Transfer' ? (
            <div className="flex items-end gap-2">
              <div className="flex-1 min-w-0">
                <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.from}</label>
                <select value={accountId} onChange={e => setAccountId(e.target.value)} className={inputClass}>{walletOptions}</select>
              </div>
              <span className="material-symbols-rounded text-transfer pb-3.5">arrow_forward</span>
              <div className="flex-1 min-w-0">
                <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.to}</label>
                <select value={toAccountId} onChange={e => setToAccountId(e.target.value)} className={inputClass}>{walletOptions}</select>
              </div>
            </div>
          ) : (
            <div className="flex gap-3">
              <div className="flex-1 min-w-0">
                <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.wallet}</label>
                <select value={accountId} onChange={e => setAccountId(e.target.value)} className={inputClass}>
                  {accounts.length === 0 && <option value="">Belum Ada Dompet</option>}
                  {walletOptions}
                </select>
              </div>
              <div className="flex-1 min-w-0">
                <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.category}</label>
                <select value={selection} onChange={e => setSelection(e.target.value)} className={inputClass}>
                  {options.length === 0 && <option value="">—</option>}
                  {options.map(o => <option key={o.value} value={o.value} className="text-black">{o.label}</option>)}
                </select>
              </div>
            </div>
          )}

          <div>
            <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.note}</label>
            <input type="text" placeholder="..." value={desc} onChange={e => setDesc(e.target.value)} className={inputClass} />
          </div>

          <button disabled={saving} onClick={submit} className={`w-full bg-accent text-white font-extrabold text-[15px] py-3.5 rounded-[16px] mt-1 shadow-[0_10px_24px_rgba(0,122,255,0.3)] ${saving ? 'opacity-50' : ''}`}>
            {saving ? '...' : t.save}
          </button>
        </div>
      );
    }

    function CenterScreen({ children }) {
      return (
        <div className="flex justify-center items-center min-h-screen w-full p-6">
          <div className="w-full max-w-[360px] flex flex-col items-center gap-3 text-center">{children}</div>
        </div>
      );
    }

    function LoginScreen() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState('');
      const isDark = document.documentElement.classList.contains('dark');

      const submit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setErr('');
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        if (error) setErr(error.message);
        setLoading(false);
      };

      const inputClass = `w-full ${isDark ? 'bg-black/30 text-white' : 'bg-white/70'} rounded-[16px] p-3.5 text-[14px] font-bold outline-none`;
      return (
        <CenterScreen>
          <div className="w-16 h-16 rounded-[22px] bg-gradient-to-tr from-accent to-[#5AC8FA] flex items-center justify-center text-white shadow-lg mb-2">
            <span className="material-symbols-rounded text-[32px]">account_balance_wallet</span>
          </div>
          <h1 className="text-[26px] font-extrabold tracking-tight">OURFIN</h1>
          <form onSubmit={submit} className={`${isDark ? 'glass-dark' : 'glass'} w-full rounded-[28px] p-6 space-y-3 text-left`}>
            <input type="email" autoComplete="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className={inputClass} required />
            <input type="password" autoComplete="current-password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className={inputClass} required />
            {err && <p className="text-expense text-[12px] font-bold">{err}</p>}
            <button disabled={loading} className={`w-full bg-accent text-white font-extrabold text-[15px] py-3.5 rounded-[16px] ${loading ? 'opacity-50' : ''}`}>{loading ? '...' : 'Masuk'}</button>
          </form>
        </CenterScreen>
      );
    }

    function Root() {
      const [session, setSession] = useState(undefined);

      useEffect(() => {
        if (!sb) return;
        sb.auth.getSession().then(({ data }) => setSession(data.session));
        const { data } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
        return () => data.subscription.unsubscribe();
      }, []);

      if (!sb) {
        return (
          <CenterScreen>
            <span className="material-symbols-rounded text-[40px] text-warning">settings</span>
            <h2 className="text-[18px] font-extrabold">Supabase belum dikonfigurasi</h2>
            <p className="text-[13px] opacity-70">Isi <b>SUPABASE_URL</b> dan <b>SUPABASE_KEY</b> di bagian atas script pada index.html.</p>
          </CenterScreen>
        );
      }
      if (session === undefined) {
        return <CenterScreen><div className="w-10 h-10 border-4 border-accent/20 border-t-accent rounded-full animate-spin"></div></CenterScreen>;
      }
      if (!session) return <LoginScreen />;
      return <App session={session} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>

  <!-- REGISTRASI SERVICE WORKER UNTUK PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.error('Gagal mendaftarkan Service Worker', err));
      });
    }
  </script>

</body>
</html>
