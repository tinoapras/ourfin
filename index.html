    body { margin: 0; font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }

      background-image:
        radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(52, 199, 89, 0.08) 0px, transparent 50%),

    .glass { background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 10px 40px rgba(0,0,0,0.06); }

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ================= KONFIGURASI SUPABASE (UBAH DI SINI) =================
    // Ambil dari Supabase Dashboard > Project Settings > API (atau "Connect").
    const SUPABASE_URL = "https://ykggesdaahycypqbzhif.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vjpBa6LgNyO09mIPfN2LTw_OneP5ojf";   // tempel lengkap hasil copy
    // =======================================================================

    const isConfigured = !SUPABASE_URL.includes('PROJECT_ID') && !SUPABASE_KEY.startsWith('PASTE_');
    const sb = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const pad2 = (n) => String(n).padStart(2, '0');
    const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };

    const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
    const formatNumberInput = (val) => {
      if (!val) return '';
      const cleanNum = val.toString().replace(/\D/g, '');
      return cleanNum.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    };

    const timeAgo = (timestamp, lang) => {
      if (!timestamp) return lang === 'id' ? 'Baru saja' : 'Just now';
      const seconds = Math.floor((Date.now() - timestamp) / 1000);
      if (seconds < 60) return lang === 'id' ? 'Baru saja' : 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return lang === 'id' ? `${minutes} menit lalu` : `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return lang === 'id' ? `${hours} jam lalu` : `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return lang === 'id' ? `${days} hari lalu` : `${days}d ago`;
    };

    const formatDetailedDateTime = (timestamp) => {
      if (!timestamp) return '-';
      const d = new Date(timestamp);
      return `${d.getDate()} ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'][d.getMonth()]} ${d.getFullYear()}, ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    };

    const playNotificationSound = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    };

    // Tampilan per jenis transaksi
    const TX_META = {
      Income:    { icon: 'payments',      badge: 'bg-income/15 text-income',     text: 'text-income',   sign: '+' },
      Expense:   { icon: 'shopping_cart', badge: 'bg-expense/15 text-expense',   text: 'text-expense',  sign: '-' },
      Goal:      { icon: 'shield',        badge: 'bg-accent/15 text-accent',     text: 'text-accent',   sign: '-' },
      Bill:      { icon: 'receipt_long',  badge: 'bg-warning/15 text-warning',   text: 'text-warning',  sign: '-' },
      Investasi: { icon: 'trending_up',   badge: 'bg-invest/15 text-invest',     text: 'text-invest',   sign: '-' },
      Transfer:  { icon: 'swap_horiz',    badge: 'bg-transfer/15 text-transfer', text: 'text-transfer', sign: ''  },
    };
    const txMeta = (type) => TX_META[type] || TX_META.Expense;

    const dict = {
      id: {
        welcome: 'Selamat datang', switch: 'Ganti', overview: 'Ringkasan', planning: 'Perencanaan', report: 'Laporan', settings: 'Pengaturan',
        liquid: 'Total Saldo Likuid', invest: 'Investasi', savings: 'Tabungan', accounts: 'Rekening & Dompet', recent: 'Aktivitas Terakhir',
        budget: 'Anggaran', goals: 'Target', bills: 'Tagihan (Bills)', lang: 'Bahasa', dark: 'Mode Gelap', addTx: 'Catat Transaksi', save: 'Simpan', cancel: 'Batal',
        expense: 'Pengeluaran', income: 'Pemasukan', note: 'Catatan', category: 'Kategori', wallet: 'Dompet', edit: 'Edit', delete: 'Hapus',
        manageWallet: 'Kelola Dompet', manageCat: 'Kelola Kategori', exportData: 'Ekspor Data (Backup JSON)',
        switchProfile: 'Ganti Profil?', confirmSwitch: 'Apakah Anda yakin ingin beralih mencatat transaksi sebagai',
        resetAll: 'Reset Total Database', confirmReset: 'PERINGATAN! Ini akan menghapus SEMUA transaksi dan mereset dompet, kategori, serta anggaran kembali ke bawaan (kosong).',
        typeReset: 'Ketik RESET untuk konfirmasi',
        more: 'Selengkapnya', allActivity: 'Semua Aktivitas Detail', totalBudget: 'Sisa Anggaran', totalBills: 'Sisa Tagihan',
        netEstimate: 'Estimasi Bersih', cycleIn: 'Masuk Siklus', cycleOut: 'Keluar Siklus', remaining: 'Sisa', collected: 'Terkumpul',
        paid: 'Lunas', unpaid: 'Belum', detailTx: 'Detail Transaksi', noHistory: 'Belum ada riwayat transaksi.', noWallets: 'Belum ada dompet. Tambahkan sekarang.',
        transfer: 'Transfer', from: 'Dari', to: 'Ke', needTwoWallets: 'Transfer butuh minimal 2 dompet.', sameWallet: 'Dompet asal dan tujuan tidak boleh sama.',
        lowBalance: 'Saldo dompet asal tidak cukup. Tetap lanjutkan?', chooseCat: 'Pilih kategori terlebih dahulu.', noWalletAlert: 'Anda belum memiliki dompet. Tambahkan dompet dulu di halaman Home.',
        confirmDeleteTx: 'Hapus transaksi ini?', confirmDeletePlan: 'Hapus item ini? Riwayat transaksinya tetap tersimpan.',
        confirmDeleteWallet: 'Hapus dompet ini? Transaksi dompet ini tidak akan terhitung lagi di saldo.',
        loading: 'Memuat data...', syncFail: 'Gagal terhubung ke database.', retry: 'Coba Lagi', offlineNote: 'Offline — data mungkin belum yang terbaru.',
        saveFail: 'Gagal menyimpan', logout: 'Keluar', empty: 'Belum ada data. Tekan + untuk menambah.', resetDone: 'Database berhasil direset ke pengaturan awal (kosong).'
      },
      en: {
        welcome: 'Welcome', switch: 'Switch', overview: 'Overview', planning: 'Planning', report: 'Reports', settings: 'Settings',
        liquid: 'Total Liquid Balance', invest: 'Investments', savings: 'Savings', accounts: 'Accounts & Wallets', recent: 'Recent Activity',
        budget: 'Budget', goals: 'Goals', bills: 'Bills', lang: 'Language', dark: 'Dark Mode', addTx: 'Add Transaction', save: 'Save', cancel: 'Cancel',
        expense: 'Expense', income: 'Income', note: 'Note', category: 'Category', wallet: 'Wallet', edit: 'Edit', delete: 'Delete',
        manageWallet: 'Manage Wallets', manageCat: 'Manage Categories', exportData: 'Export Data (JSON Backup)',
        switchProfile: 'Switch Profile?', confirmSwitch: 'Are you sure you want to switch transaction logging to',
        resetAll: 'Full Database Reset', confirmReset: 'WARNING! This will delete ALL transactions and reset wallets, categories, and plans to empty defaults.',
        typeReset: 'Type RESET to confirm',
        more: 'More', allActivity: 'All Activity Details', totalBudget: 'Remaining Budget', totalBills: 'Unpaid Bills',
        netEstimate: 'Net Estimate', cycleIn: 'Cycle In', cycleOut: 'Cycle Out', remaining: 'Remaining', collected: 'Collected',
        paid: 'Paid', unpaid: 'Unpaid', detailTx: 'Transaction Detail', noHistory: 'No transaction history.', noWallets: 'No wallets yet. Add one now.',
        transfer: 'Transfer', from: 'From', to: 'To', needTwoWallets: 'Transfer needs at least 2 wallets.', sameWallet: 'Source and destination wallets must differ.',
        lowBalance: 'Source wallet balance is insufficient. Continue anyway?', chooseCat: 'Please choose a category first.', noWalletAlert: 'You have no wallets yet. Add one first on the Home page.',
        confirmDeleteTx: 'Delete this transaction?', confirmDeletePlan: 'Delete this item? Its transaction history stays saved.',
        confirmDeleteWallet: 'Delete this wallet? Its transactions will no longer count toward balances.',
        loading: 'Loading data...', syncFail: 'Could not connect to the database.', retry: 'Retry', offlineNote: 'Offline — data may not be up to date.',
        saveFail: 'Failed to save', logout: 'Log out', empty: 'No data yet. Tap + to add.', resetDone: 'Database reset to empty defaults.'
      }
    };

    const MONTH_NAMES = {
      id: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'],
      en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
    };

    const USERS = {
      u1: { id: 'u1', name: 'Suami', avatar: '👨🏻' },
      u2: { id: 'u2', name: 'Istri', avatar: '👩🏻' }
    };

    const DEFAULT_SETTINGS = {
      accounts: [],
      incomeCats: ['Gaji', 'Bonus', 'Hasil Usaha', 'Lainnya'],
      expenseCats: ['Groceries', 'Kebutuhan Pokok', 'Keinginan', 'Transport', 'Bayi & Anak', 'Listrik & Air'],
      budgets: [],
      goals: [],
      bills: [],
      investments: []
    };

    // Konversi baris database <-> objek aplikasi
    const txFromRow = (r) => ({
      id: r.id, type: r.type, amount: Number(r.amount),
      accountId: r.account_id, toAccountId: r.to_account_id,
      category: r.category, goalId: r.goal_id, billId: r.bill_id, investmentId: r.investment_id,
      desc: r.note, icon: r.icon, date: r.date, creator: r.creator, createdAt: Number(r.created_at)
    });
    const txToRow = (tx) => ({
      type: tx.type, amount: tx.amount,
      account_id: tx.accountId || null, to_account_id: tx.toAccountId || null,
      category: tx.category || null, goal_id: tx.goalId || null, bill_id: tx.billId || null, investment_id: tx.investmentId || null,
      note: tx.desc || null, icon: tx.icon || null, date: tx.date, creator: tx.creator, created_at: tx.createdAt
    });

    function App({ session }) {
      const [isDark, setIsDark] = useState(() => localStorage.getItem('ourfin_dark') === 'true');
      const [lang, setLang] = useState(() => localStorage.getItem('ourfin_lang') || 'id');
      const [activeUser, setActiveUser] = useState(() => {
        try { const saved = localStorage.getItem('ourfin_active_user'); if (saved) return JSON.parse(saved); } catch (e) {}
        return USERS.u1;
      });

      const [pendingUser, setPendingUser] = useState(null);
      const [resetConfirm, setResetConfirm] = useState(false);
      const [resetText, setResetText] = useState('');
      const [view, setView] = useState('Overview');
      const [planTab, setPlanTab] = useState('Budget');
      const [modal, setModal] = useState(null);
      const [detailData, setDetailData] = useState(null);
      const [showAllActivity, setShowAllActivity] = useState(false);
      const [txPrefill, setTxPrefill] = useState(null);
      const [loaded, setLoaded] = useState(false);
      const [syncError, setSyncError] = useState(null);
      const t = dict[lang];

      const [accounts, setAccounts] = useState(DEFAULT_SETTINGS.accounts);
      const [incomeCats, setIncomeCats] = useState(DEFAULT_SETTINGS.incomeCats);
      const [expenseCats, setExpenseCats] = useState(DEFAULT_SETTINGS.expenseCats);
      const [budgets, setBudgets] = useState(DEFAULT_SETTINGS.budgets);
      const [goals, setGoals] = useState(DEFAULT_SETTINGS.goals);
      const [bills, setBills] = useState(DEFAULT_SETTINGS.bills);
      const [investments, setInvestments] = useState(DEFAULT_SETTINGS.investments);
      const [transactions, setTransactions] = useState([]);

      const activeUserRef = useRef(activeUser);
      useEffect(() => { activeUserRef.current = activeUser; }, [activeUser]);

      useEffect(() => {
        localStorage.setItem('ourfin_dark', isDark);
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      useEffect(() => { localStorage.setItem('ourfin_lang', lang); }, [lang]);

      // ---------- SINKRONISASI SUPABASE ----------
      const setters = { accounts: setAccounts, incomeCats: setIncomeCats, expenseCats: setExpenseCats, budgets: setBudgets, goals: setGoals, bills: setBills, investments: setInvestments };
      const applySetting = (key, items) => { const fn = setters[key]; if (fn) fn(Array.isArray(items) ? items : []); };

      const fetchAll = async () => {
        try {
          // Supabase membatasi 1000 baris per request, jadi diambil per halaman
          const PAGE = 1000;
          let rows = [];
          for (let from = 0; ; from += PAGE) {
            const { data, error } = await sb.from('transactions').select('*').order('created_at', { ascending: false }).range(from, from + PAGE - 1);
            if (error) throw error;
            rows = rows.concat(data);
            if (data.length < PAGE) break;
          }
          const { data: sets, error: setErr } = await sb.from('settings').select('key, items');
          if (setErr) throw setErr;

          setTransactions(rows.map(txFromRow));
          sets.forEach(s => applySetting(s.key, s.items));
          setSyncError(null);
          setLoaded(true);
        } catch (err) {
          console.error(err);
          setSyncError(err.message || String(err));
        }
      };

      useEffect(() => {
        fetchAll();

        const channel = sb.channel('ourfin-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, (payload) => {
            if (payload.eventType === 'INSERT') {
              const tx = txFromRow(payload.new);
              setTransactions(prev => prev.some(p => p.id === tx.id) ? prev : [tx, ...prev]);
              if (tx.creator !== activeUserRef.current.name) playNotificationSound();
            } else if (payload.eventType === 'UPDATE') {
              const tx = txFromRow(payload.new);
              setTransactions(prev => prev.map(p => p.id === tx.id ? tx : p));
            } else if (payload.eventType === 'DELETE') {
              setTransactions(prev => prev.filter(p => p.id !== payload.old.id));
            }
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, (payload) => {
            if (payload.new && payload.new.key) applySetting(payload.new.key, payload.new.items);
          })
          .subscribe();

        // HP sering memutus koneksi realtime saat aplikasi di background → muat ulang saat dibuka lagi
        const onVisible = () => { if (document.visibilityState === 'visible') fetchAll(); };
        document.addEventListener('visibilitychange', onVisible);
        window.addEventListener('online', fetchAll);

        return () => {
          sb.removeChannel(channel);
          document.removeEventListener('visibilitychange', onVisible);
          window.removeEventListener('online', fetchAll);
        };
      }, []);

      const saveCloudSettings = async (key, items) => {
        if (!loaded) return false; // jangan pernah menulis sebelum data asli termuat
        const { error } = await sb.from('settings').upsert({ key, items, updated_at: new Date().toISOString() });
        if (error) { alert(`${t.saveFail}: ${error.message}`); return false; }
        applySetting(key, items);
        return true;
      };

      const addTransactionToCloud = async (tx) => {
        if (!loaded) return false;
        const { data, error } = await sb.from('transactions').insert(txToRow(tx)).select().single();
        if (error) { alert(`${t.saveFail}: ${error.message}`); return false; }
        const saved = txFromRow(data);
        setTransactions(prev => prev.some(p => p.id === saved.id) ? prev : [saved, ...prev]);
        return true;
      };

      const deleteTransactionFromCloud = async (id) => {
        if (!window.confirm(t.confirmDeleteTx)) return false;
        const { error } = await sb.from('transactions').delete().eq('id', id);
        if (error) { alert(`${t.saveFail}: ${error.message}`); return false; }
        setTransactions(prev => prev.filter(p => p.id !== id));
        return true;
      };

      const resetAllDataCloud = async () => {
        const { error } = await sb.from('transactions').delete().not('id', 'is', null);
        if (error) { alert(`${t.saveFail}: ${error.message}`); return; }
        const nowIso = new Date().toISOString();
        const rows = Object.entries(DEFAULT_SETTINGS).map(([key, items]) => ({ key, items, updated_at: nowIso }));
        const { error: e2 } = await sb.from('settings').upsert(rows);
        if (e2) { alert(`${t.saveFail}: ${e2.message}`); return; }
        setTransactions([]);
        Object.entries(DEFAULT_SETTINGS).forEach(([k, v]) => applySetting(k, v));
        setResetConfirm(false);
        setResetText('');
        alert(t.resetDone);
      };

      const exportData = () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          transactions,
          settings: { accounts, incomeCats, expenseCats, budgets, goals, bills, investments }
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ourfin-backup-${todayStr()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      // ---------- SIKLUS 10 s/d 10 ----------
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonthIndex = now.getMonth();

      let cycleYear = currentYear;
      let cycleMonth = currentMonthIndex;
      if (now.getDate() < 10) {
        cycleMonth -= 1;
        if (cycleMonth < 0) { cycleMonth = 11; cycleYear -= 1; }
      }
      const nextCycleMonth = cycleMonth === 11 ? 0 : cycleMonth + 1;
      const nextCycleYear = cycleMonth === 11 ? cycleYear + 1 : cycleYear;
      const cycleStart = `${cycleYear}-${pad2(cycleMonth + 1)}-10`;
      const cycleEnd = `${nextCycleYear}-${pad2(nextCycleMonth + 1)}-10`; // eksklusif
      const inCycle = (d) => !!d && d >= cycleStart && d < cycleEnd;

      const [reportMonthIndex, setReportMonthIndex] = useState(currentMonthIndex);
      const [reportYear, setReportYear] = useState(currentYear);
      const reportYm = `${reportYear}-${pad2(reportMonthIndex + 1)}`;

      // ---------- PERHITUNGAN ----------
      const calculatedAccounts = useMemo(() => {
        return accounts.map(acc => {
          let balance = 0;
          transactions.forEach(tx => {
            const amt = Number(tx.amount) || 0;
            if (tx.type === 'Transfer') {
              if (tx.accountId === acc.id) balance -= amt;
              if (tx.toAccountId === acc.id) balance += amt;
              return;
            }
            if (tx.accountId !== acc.id) return;
            if (tx.type === 'Income') balance += amt;
            if (['Expense', 'Goal', 'Investasi', 'Bill'].includes(tx.type)) balance -= amt;
          });
          return { ...acc, balance };
        });
      }, [accounts, transactions]);

      const accName = (id) => accounts.find(a => a.id === id)?.name || (lang === 'id' ? '(dihapus)' : '(deleted)');
      const txTitle = (tx) => tx.type === 'Transfer' ? `${accName(tx.accountId)} → ${accName(tx.toAccountId)}` : (tx.desc || tx.category);
      const sortedTx = useMemo(() => [...transactions].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)), [transactions]);

      const totalLiquidBalance = calculatedAccounts.reduce((sum, acc) => sum + acc.balance, 0);

      const totalInvestedMarket = investments.reduce((sum, inv) => {
        const modalAmt = transactions.filter(tx => tx.type === 'Investasi' && tx.investmentId === inv.id).reduce((s, tx) => s + Number(tx.amount), 0);
        return sum + (modalAmt * (1 + (Number(inv.mockReturnPct) / 100)));
      }, 0);

      const totalGoalsSaved = goals.reduce((sum, g) => {
        return sum + transactions.filter(tx => tx.type === 'Goal' && tx.goalId === g.id).reduce((s, tx) => s + Number(tx.amount), 0);
      }, 0);

      const spentInCycle = (category) => transactions.filter(tx => tx.type === 'Expense' && tx.category === category && inCycle(tx.date)).reduce((s, tx) => s + Number(tx.amount), 0);
      const isBillPaid = (billId) => transactions.some(tx => tx.type === 'Bill' && tx.billId === billId && inCycle(tx.date));

      const totalRemainingBudget = budgets.reduce((sum, b) => {
        const remaining = Number(b.limit) - spentInCycle(b.category);
        return sum + (remaining > 0 ? remaining : 0);
      }, 0);

      const totalUnpaidBills = bills.reduce((sum, bl) => sum + (isBillPaid(bl.id) ? 0 : Number(bl.amount)), 0);

      const estimatedTotal = totalLiquidBalance - totalRemainingBudget - totalUnpaidBills;

      const overviewTx = transactions.filter(tx => inCycle(tx.date));
      const overviewInc = overviewTx.filter(tx => tx.type === 'Income').reduce((sum, tx) => sum + Number(tx.amount), 0);
      const overviewExp = overviewTx.filter(tx => tx.type === 'Expense').reduce((sum, tx) => sum + Number(tx.amount), 0);

      const reportTx = transactions.filter(tx => tx.date && tx.date.startsWith(reportYm));
      const sumType = (type) => reportTx.filter(tx => tx.type === type).reduce((sum, tx) => sum + Number(tx.amount), 0);
      const reportInc = sumType('Income');
      const reportExp = sumType('Expense');
      const reportGoals = sumType('Goal');
      const reportInvest = sumType('Investasi');
      const reportBills = sumType('Bill');
      const reportTransfer = sumType('Transfer');

      const glassClass = isDark ? 'glass-dark' : 'glass';

      const TxRow = ({ tx, onClick }) => {
        const m = txMeta(tx.type);
        return (
          <div className="flex items-center p-3.5 border-b border-black/5 dark:border-white/5 last:border-0 hover:bg-black/5 rounded-[18px] transition cursor-pointer" onClick={onClick}>
            <div className={`w-10 h-10 rounded-[14px] flex items-center justify-center mr-3 shadow-sm flex-shrink-0 ${m.badge}`}>
              <span className="material-symbols-rounded text-[20px]">{tx.icon || m.icon}</span>
            </div>
            <div className="flex-1 min-w-0 pr-2">
              <h4 className="font-bold text-[13px] truncate tracking-tight mb-0.5">{txTitle(tx)}</h4>
              <p className="text-[10px] opacity-50 truncate tracking-wide">{timeAgo(tx.createdAt, lang)} • {tx.creator}</p>
            </div>
            <div className={`font-bold text-[14px] whitespace-nowrap ${tx.type === 'Income' || tx.type === 'Transfer' ? m.text : ''}`}>
              {m.sign}{formatRp(tx.amount)}
            </div>
          </div>
        );
      };

      const DetailRow = ({ tx, onDelete }) => {
        const m = txMeta(tx.type);
        return (
          <div className="p-3.5 bg-black/5 dark:bg-white/5 rounded-[18px] flex justify-between items-center">
            <div className="truncate pr-3 flex-1">
              <p className="font-bold text-[13px] truncate">{txTitle(tx)}</p>
              {tx.type === 'Transfer' && tx.desc && <p className="text-[11px] opacity-60 truncate">{tx.desc}</p>}
              <p className="text-[10px] opacity-50 mt-0.5">{formatDetailedDateTime(tx.createdAt)} • {tx.creator}</p>
            </div>
            <div className="flex items-center gap-2">
              <p className={`font-extrabold text-[13px] ${m.text}`}>{m.sign}{formatRp(tx.amount)}</p>
              {onDelete && <button onClick={onDelete} className="text-expense bg-expense/10 p-1.5 rounded-lg"><span className="material-symbols-rounded text-[14px]">delete</span></button>}
            </div>
          </div>
        );
      };

      const EmptyPlan = () => <p className="text-center opacity-50 py-8 text-[12px] font-semibold">{t.empty}</p>;

      return (
        <div className="flex justify-center items-center min-h-screen w-full p-0 sm:p-4">
          <div className="w-full sm:max-w-[428px] h-screen sm:h-[880px] sm:rounded-[48px] sm:border-[8px] sm:border-[#2C2C2E] relative flex flex-col shadow-2xl overflow-hidden bg-[#F5F5F7] dark:bg-[#1C1C1E]">

            <div className="flex-1 overflow-y-auto px-6 pt-12 pb-36 no-scrollbar flex flex-col justify-start">

              <div className="pb-5 flex justify-between items-center z-10 flex-shrink-0">
                <div>
                  <p className="text-[12px] opacity-60 font-medium tracking-wide">{t.welcome},</p>
                  <h1 className="text-[24px] font-extrabold tracking-tight mt-0.5">{activeUser.name}</h1>
                </div>
                <button onClick={() => setPendingUser(activeUser.id === 'u1' ? USERS.u2 : USERS.u1)}
                  className={`${glassClass} px-3.5 py-2 rounded-[18px] flex items-center gap-2 hover:scale-105 active:scale-95 transition-all`}>
                  <span className="text-lg drop-shadow-sm">{activeUser.avatar}</span>
                  <span className="text-[12px] font-bold text-accent">{t.switch}</span>
                </button>
              </div>

              {loaded && syncError && (
                <div className="mb-4 px-3 py-2 rounded-xl bg-warning/15 text-warning text-[11px] font-bold flex items-center gap-1.5">
                  <span className="material-symbols-rounded text-[14px]">cloud_off</span>{t.offlineNote}
                </div>
              )}

              {view === 'Overview' && (
                <div className="space-y-6 animate-[fadeIn_0.3s_ease]">
                  <div className={`${glassClass} rounded-[28px] p-6 relative overflow-hidden space-y-3`}>
                    <div className="absolute top-0 right-0 w-36 h-36 bg-accent opacity-10 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>

                    <div>
                      <p className="text-[10px] uppercase tracking-widest opacity-60 font-bold mb-1">{t.liquid}</p>
                      <h2 className="text-[32px] font-extrabold tracking-tighter">{formatRp(totalLiquidBalance)}</h2>
                    </div>

                    <div className="flex flex-col gap-1 pt-1 border-t border-black/5 dark:border-white/5 text-[11px] font-semibold opacity-75">
                      <div className="flex justify-between"><span>{t.totalBudget}:</span><span className="font-bold">{formatRp(totalRemainingBudget)}</span></div>
                      <div className="flex justify-between"><span>{t.totalBills}:</span><span className="font-bold">{formatRp(totalUnpaidBills)}</span></div>
                    </div>

                    <div className="pt-2 border-t border-black/5 dark:border-white/5 flex justify-between items-center">
                      <span className="text-[10px] uppercase tracking-wider font-bold opacity-60">{t.netEstimate}:</span>
                      <span className={`text-[13px] font-extrabold ${estimatedTotal < 0 ? 'text-expense' : 'text-accent'}`}>{formatRp(estimatedTotal)}</span>
                    </div>

                    <div className="flex gap-3 pt-2 border-t border-black/5 dark:border-white/5">
                      <div className="flex-1">
                        <p className="text-[9px] opacity-50 font-bold uppercase tracking-wider mb-0.5">{t.cycleIn}</p>
                        <p className="font-extrabold text-[13px] text-income">{formatRp(overviewInc)}</p>
                      </div>
                      <div className="flex-1">
                        <p className="text-[9px] opacity-50 font-bold uppercase tracking-wider mb-0.5">{t.cycleOut}</p>
                        <p className="font-extrabold text-[13px] text-expense">{formatRp(overviewExp)}</p>
                      </div>
                    </div>

                    <div className="flex gap-3 relative z-10 pt-1">
                      <div className="flex-1 bg-black/5 dark:bg-white/5 rounded-2xl p-3 cursor-pointer hover:bg-black/10 transition" onClick={() => { setView('Planning'); setPlanTab('Investasi'); }}>
                        <p className="text-[9px] opacity-60 font-bold uppercase mb-0.5 flex items-center gap-1"><span className="material-symbols-rounded text-[13px] text-invest">trending_up</span> {t.invest}</p>
                        <p className="text-[13px] font-bold text-invest">{formatRp(totalInvestedMarket)}</p>
                      </div>
                      <div className="flex-1 bg-black/5 dark:bg-white/5 rounded-2xl p-3 cursor-pointer hover:bg-black/10 transition" onClick={() => { setView('Planning'); setPlanTab('Goals'); }}>
                        <p className="text-[9px] opacity-60 font-bold uppercase mb-0.5 flex items-center gap-1"><span className="material-symbols-rounded text-[13px] text-accent">shield</span> {t.savings}</p>
                        <p className="text-[13px] font-bold text-accent">{formatRp(totalGoalsSaved)}</p>
                      </div>
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-3 px-1">
                      <h3 className="text-[16px] font-bold tracking-tight">{t.accounts}</h3>
                      <div className="flex items-center gap-2">
                        {accounts.length >= 2 && (
                          <button onClick={() => setTxPrefill({ type: 'Transfer' })} className="text-transfer bg-transfer/10 px-3 py-1.5 rounded-[12px] flex items-center gap-1 hover:bg-transfer/20 transition">
                            <span className="material-symbols-rounded text-[14px]">swap_horiz</span>
                            <span className="text-[11px] font-bold">{t.transfer}</span>
                          </button>
                        )}
                        <button onClick={() => setModal('ManageAccounts')} className="text-accent bg-accent/10 px-3 py-1.5 rounded-[12px] flex items-center gap-1 hover:bg-accent/20 transition">
                          <span className="material-symbols-rounded text-[14px]">{accounts.length === 0 ? 'add' : 'edit'}</span>
                          <span className="text-[11px] font-bold">{accounts.length === 0 ? (lang === 'id' ? 'Tambah' : 'Add') : t.edit}</span>
                        </button>
                      </div>
                    </div>
                    <div className="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                      {calculatedAccounts.length === 0 ? (
                        <p className="text-center opacity-50 py-3 text-[12px] font-semibold w-full italic">{t.noWallets}</p>
                      ) : (
                        calculatedAccounts.map(acc => (
                          <div key={acc.id} className={`${glassClass} min-w-[140px] p-4 rounded-[20px] flex-shrink-0`}>
                            <div className="flex items-center gap-2 mb-2">
                              <span className="material-symbols-rounded text-accent bg-accent/10 p-1 rounded-[8px] text-[16px] shadow-sm">{acc.icon}</span>
                              <span className="text-[12px] font-bold truncate tracking-tight">{acc.name}</span>
                            </div>
                            <p className={`font-extrabold text-[14px] ${acc.balance < 0 ? 'text-expense' : ''}`}>{formatRp(acc.balance)}</p>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-3 px-1">
                      <h3 className="text-[16px] font-bold tracking-tight">{t.recent}</h3>
                      <button onClick={() => setShowAllActivity(true)} className="text-accent text-[12px] font-bold hover:underline">{t.more} &gt;</button>
                    </div>
                    <div className={`${glassClass} rounded-[24px] p-2`}>
                      {sortedTx.length === 0 ? (
                        <p className="text-center opacity-50 py-8 text-[12px] font-semibold">{t.noHistory}</p>
                      ) : (
                        sortedTx.slice(0, 5).map(tx => (
                          <TxRow key={tx.id} tx={tx} onClick={() => setDetailData({ title: t.detailTx, type: 'Detail Transaksi', txs: [tx] })} />
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}

              {view === 'Planning' && (
                <div className="animate-[fadeIn_0.3s_ease] space-y-5">
                  <div className="flex justify-between items-center">
                    <h2 className="text-[24px] font-extrabold tracking-tight">{t.planning}</h2>
                    <button onClick={() => setModal('AddPlan')} className={`${glassClass} text-accent w-9 h-9 rounded-[12px] flex items-center justify-center hover:scale-110 transition shadow-sm`}>
                      <span className="material-symbols-rounded text-[20px]">add</span>
                    </button>
                  </div>

                  <div className="flex bg-black/5 dark:bg-white/5 p-1 rounded-[20px]">
                    {['Budget', 'Goals', 'Bills', 'Investasi'].map(tab => (
                      <button key={tab} onClick={() => setPlanTab(tab)}
                        className={`flex-1 py-2.5 text-[11px] font-bold rounded-[16px] transition-all tracking-tight ${planTab === tab ? 'bg-white dark:bg-[#2C2C2E] shadow-sm' : 'opacity-60'}`}>
                        {tab === 'Budget' ? t.budget : tab === 'Goals' ? t.goals : tab === 'Bills' ? t.bills : t.invest}
                      </button>
                    ))}
                  </div>

                  <div className="space-y-3.5">
                    {planTab === 'Budget' && budgets.length === 0 && <EmptyPlan />}
                    {planTab === 'Budget' && budgets.map(b => {
                      const spent = spentInCycle(b.category);
                      const pct = b.limit > 0 ? Math.min(100, (spent / b.limit) * 100) : 0;
                      return (
                        <div key={b.id} className={`${glassClass} p-5 rounded-[24px] space-y-3`}>
                          <div className="flex justify-between items-center cursor-pointer" onClick={() => setDetailData({ title: b.category, item: b, type: 'Budget', txs: sortedTx.filter(tx => tx.type === 'Expense' && tx.category === b.category) })}>
                            <div>
                              <h4 className="font-bold flex items-center gap-1.5 text-[14px] tracking-tight"><span className="material-symbols-rounded text-[18px] text-expense">{b.icon}</span> {b.category}</h4>
                              <p className="text-[11px] opacity-50 mt-1">{t.budget} (10-10): {formatRp(b.limit)}</p>
                            </div>
                            <div className="text-right">
                              <p className="text-[10px] opacity-50 uppercase font-bold tracking-wider">{t.remaining}</p>
                              <p className={`font-extrabold text-[14px] ${b.limit - spent < 0 ? 'text-expense' : ''}`}>{formatRp(b.limit - spent)}</p>
                            </div>
                          </div>
                          <div className="w-full bg-black/5 dark:bg-white/5 h-2 rounded-full overflow-hidden">
                            <div className={`h-full rounded-full transition-all duration-1000 ${pct > 90 ? 'bg-expense' : 'bg-accent'}`} style={{ width: `${pct}%` }}></div>
                          </div>
                          <button onClick={() => setTxPrefill({ type: 'Expense', category: b.category, amount: '', desc: `${b.category}` })} className="w-full py-2 bg-accent/10 text-accent font-bold text-xs rounded-xl hover:bg-accent/20 transition flex items-center justify-center gap-1">
                            <span className="material-symbols-rounded text-sm">add_circle</span> {lang === 'id' ? 'Catat Pengeluaran' : 'Record Expense'}
                          </button>
                        </div>
                      );
                    })}

                    {planTab === 'Goals' && goals.length === 0 && <EmptyPlan />}
                    {planTab === 'Goals' && goals.map(g => {
                      const saved = transactions.filter(tx => tx.type === 'Goal' && tx.goalId === g.id).reduce((sum, tx) => sum + Number(tx.amount), 0);
                      const pct = g.target > 0 ? Math.min(100, (saved / g.target) * 100) : 0;
                      return (
                        <div key={g.id} className={`${glassClass} p-5 rounded-[24px] space-y-3`}>
                          <div className="flex justify-between items-center cursor-pointer" onClick={() => setDetailData({ title: g.name, item: g, type: 'Goal', txs: sortedTx.filter(tx => tx.type === 'Goal' && tx.goalId === g.id) })}>
                            <div>
                              <h4 className="font-bold flex items-center gap-1.5 text-[14px] tracking-tight"><span className="material-symbols-rounded text-[18px] text-accent">{g.icon}</span> {g.name}</h4>
                              <p className="text-[11px] opacity-50 mt-1">Target: {formatRp(g.target)}</p>
                            </div>
                            <div className="text-right">
                              <p className="text-[10px] opacity-50 uppercase font-bold tracking-wider">{t.collected}</p>
                              <p className="font-extrabold text-[14px] text-accent">{formatRp(saved)}</p>
                            </div>
                          </div>
                          <div className="w-full bg-black/5 dark:bg-white/5 h-2 rounded-full overflow-hidden">
                            <div className="h-full rounded-full bg-accent transition-all duration-1000" style={{ width: `${pct}%` }}></div>
                          </div>
                          <button onClick={() => setTxPrefill({ type: 'Goal', category: g.name, goalId: g.id, amount: '', desc: `Setor Target ${g.name}` })} className="w-full py-2 bg-accent/10 text-accent font-bold text-xs rounded-xl hover:bg-accent/20 transition flex items-center justify-center gap-1">
                            <span className="material-symbols-rounded text-sm">savings</span> {lang === 'id' ? 'Tabung Target' : 'Save to Goal'}
                          </button>
                        </div>
                      );
                    })}

                    {planTab === 'Bills' && bills.length === 0 && <EmptyPlan />}
                    {planTab === 'Bills' && bills.map(bl => {
                      const isPaid = isBillPaid(bl.id);
                      return (
                        <div key={bl.id} className={`${glassClass} p-5 rounded-[24px] flex items-center justify-between`}>
                          <div className="flex items-center gap-3.5 cursor-pointer flex-1" onClick={() => setDetailData({ title: bl.name, item: bl, type: 'Bill', txs: sortedTx.filter(tx => tx.type === 'Bill' && tx.billId === bl.id) })}>
                            <div className="w-10 h-10 bg-warning/15 text-warning rounded-[16px] flex items-center justify-center flex-shrink-0">
                              <span className="material-symbols-rounded text-[20px]">{bl.icon}</span>
                            </div>
                            <div>
                              <h4 className="font-bold text-[14px]">{bl.name} <span className="text-[10px] opacity-50">({MONTH_NAMES[lang][cycleMonth]} {cycleYear})</span></h4>
                              <p className="text-[11px] opacity-50 mt-0.5">{formatRp(bl.amount)}</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className={`px-2.5 py-1 rounded-lg text-[10px] font-extrabold ${isPaid ? 'bg-income/15 text-income' : 'bg-warning/15 text-warning'}`}>
                              {isPaid ? t.paid : t.unpaid}
                            </span>
                            {!isPaid && (
                              <button onClick={() => setTxPrefill({ type: 'Bill', category: bl.name, billId: bl.id, amount: bl.amount, desc: `Bayar Tagihan ${bl.name}` })} className="px-3 py-1.5 bg-accent text-white rounded-xl text-xs font-bold shadow-sm">
                                {lang === 'id' ? 'Bayar' : 'Pay'}
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}

                    {planTab === 'Investasi' && investments.length === 0 && <EmptyPlan />}
                    {planTab === 'Investasi' && investments.map(inv => {
                      const modalAmt = transactions.filter(tx => tx.type === 'Investasi' && tx.investmentId === inv.id).reduce((sum, tx) => sum + Number(tx.amount), 0);
                      const currentVal = modalAmt * (1 + (Number(inv.mockReturnPct) / 100));
                      const profit = currentVal - modalAmt;
                      return (
                        <div key={inv.id} className={`${glassClass} p-5 rounded-[24px] space-y-3`}>
                          <div className="flex items-center gap-4 cursor-pointer" onClick={() => setDetailData({ title: inv.name, item: inv, type: 'Investasi', txs: sortedTx.filter(tx => tx.type === 'Investasi' && tx.investmentId === inv.id) })}>
                            <div className="w-12 h-12 bg-invest/10 text-invest rounded-[16px] flex items-center justify-center shadow-sm flex-shrink-0">
                              <span className="material-symbols-rounded text-[22px]">{inv.icon}</span>
                            </div>
                            <div className="flex-1 min-w-0 pr-1">
                              <h4 className="font-bold text-[14px] tracking-tight truncate">{inv.name}</h4>
                              <p className="text-[10px] text-invest font-bold uppercase tracking-wider">{inv.type || 'Reksa Dana'} • Est. +{inv.mockReturnPct}%</p>
                              <p className="text-[11px] opacity-50 mt-0.5">Modal: {formatRp(modalAmt)}</p>
                            </div>
                            <div className="text-right whitespace-nowrap">
                              <div className="font-extrabold text-[14px] text-invest">{formatRp(currentVal)}</div>
                              <div className="text-[10px] font-bold text-income mt-0.5">+{formatRp(profit)}</div>
                            </div>
                          </div>
                          <button onClick={() => setTxPrefill({ type: 'Investasi', category: inv.name, investmentId: inv.id, amount: '', desc: `Top-up ${inv.name}` })} className="w-full py-2 bg-invest/10 text-invest font-bold text-xs rounded-xl hover:bg-invest/20 transition flex items-center justify-center gap-1">
                            <span className="material-symbols-rounded text-sm">trending_up</span> {lang === 'id' ? 'Top-up Portofolio' : 'Top-up Portfolio'}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {view === 'Report' && (
                <div className="animate-[fadeIn_0.3s_ease] space-y-5">
                  <h2 className="text-[24px] font-extrabold tracking-tight">{t.report}</h2>

                  <div className={`${glassClass} p-5 rounded-[24px] space-y-3.5`}>
                    <div className="flex justify-between items-center">
                      <span className="text-[10px] font-bold uppercase tracking-widest opacity-65">Timeline</span>
                      <input type="number" value={reportYear} onChange={(e) => setReportYear(Math.max(1970, Number(e.target.value)))} className="select-glass w-20 px-3 py-1 rounded-xl font-bold text-xs text-center outline-none" />
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-[13px] font-extrabold text-accent">{MONTH_NAMES[lang][reportMonthIndex]} {reportYear}</span>
                    </div>
                    <input type="range" min="0" max="11" step="1" value={reportMonthIndex} onChange={(e) => setReportMonthIndex(Number(e.target.value))} className="w-full accent-accent cursor-pointer h-2 bg-black/10 dark:bg-white/10 rounded-lg appearance-none" />
                  </div>

                  <div className={`${glassClass} p-6 rounded-[28px] shadow-sm space-y-3.5`}>
                    <h3 className="font-bold text-[14px] tracking-tight text-center mb-3">{MONTH_NAMES[lang][reportMonthIndex]} {reportYear}</h3>
                    <div className="flex justify-between items-center p-3 bg-black/5 dark:bg-white/5 rounded-2xl"><span className="text-xs font-bold opacity-70">{t.income}</span><span className="text-sm font-extrabold text-income">{formatRp(reportInc)}</span></div>
                    <div className="flex justify-between items-center p-3 bg-black/5 dark:bg-white/5 rounded-2xl"><span className="text-xs font-bold opacity-70">{t.expense}</span><span className="text-sm font-extrabold text-expense">{formatRp(reportExp)}</span></div>
                    <div className="flex justify-between items-center p-3 bg-black/5 dark:bg-white/5 rounded-2xl"><span className="text-xs font-bold opacity-70">{t.bills}</span><span className="text-sm font-extrabold text-warning">{formatRp(reportBills)}</span></div>
                    <div className="flex justify-between items-center p-3 bg-black/5 dark:bg-white/5 rounded-2xl"><span className="text-xs font-bold opacity-70">{t.savings}</span><span className="text-sm font-extrabold text-accent">{formatRp(reportGoals)}</span></div>
                    <div className="flex justify-between items-center p-3 bg-black/5 dark:bg-white/5 rounded-2xl"><span className="text-xs font-bold opacity-70">{t.invest}</span><span className="text-sm font-extrabold text-invest">{formatRp(reportInvest)}</span></div>
                    <div className="flex justify-between items-center p-3 bg-black/5 dark:bg-white/5 rounded-2xl"><span className="text-xs font-bold opacity-70">{t.transfer} <span className="opacity-60">({lang === 'id' ? 'antar dompet' : 'between wallets'})</span></span><span className="text-sm font-extrabold text-transfer">{formatRp(reportTransfer)}</span></div>
                  </div>
                </div>
              )}

              {view === 'Settings' && (
                <div className="animate-[fadeIn_0.3s_ease] space-y-5">
                  <h2 className="text-[24px] font-extrabold tracking-tight">{t.settings}</h2>

                  <div className={`${glassClass} rounded-[24px] overflow-hidden shadow-sm`}>
                    <div className="flex justify-between items-center p-5">
                      <span className="font-bold text-[14px]">{t.lang}</span>
                      <button onClick={() => setLang(lang === 'id' ? 'en' : 'id')} className="bg-black/5 dark:bg-white/10 px-3.5 py-1.5 rounded-xl text-[12px] font-bold">{lang.toUpperCase()}</button>
                    </div>
                    <div className="w-full h-[1px] bg-black/5 dark:bg-white/5"></div>
                    <div className="flex justify-between items-center p-5">
                      <span className="font-bold text-[14px]">{t.dark}</span>
                      <button onClick={() => setIsDark(!isDark)} className={`w-12 h-7 rounded-full p-1 transition-colors ${isDark ? 'bg-income' : 'bg-black/10'}`}>
                        <div className={`w-5 h-5 bg-white rounded-full shadow-md transition-transform ${isDark ? 'translate-x-5' : ''}`}></div>
                      </button>
                    </div>
                    <div className="w-full h-[1px] bg-black/5 dark:bg-white/5"></div>
                    <button onClick={() => setModal('ManageCategories')} className="w-full text-left p-5 font-bold text-[14px] hover:bg-black/5 dark:hover:bg-white/5 transition flex justify-between items-center">
                      {t.manageCat} <span className="material-symbols-rounded text-[18px]">chevron_right</span>
                    </button>
                  </div>

                  <div className={`${glassClass} rounded-[24px] overflow-hidden shadow-sm`}>
                    <button onClick={exportData} className="w-full text-left p-5 font-bold text-[14px] hover:bg-black/5 dark:hover:bg-white/5 transition flex justify-between items-center">
                      {t.exportData} <span className="material-symbols-rounded text-[18px]">download</span>
                    </button>
                    <div className="w-full h-[1px] bg-black/5 dark:bg-white/5"></div>
                    <button onClick={() => sb.auth.signOut()} className="w-full text-left p-5 hover:bg-black/5 dark:hover:bg-white/5 transition flex justify-between items-center">
                      <div>
                        <p className="font-bold text-[14px]">{t.logout}</p>
                        <p className="text-[11px] opacity-50 font-semibold">{session?.user?.email}</p>
                      </div>
                      <span className="material-symbols-rounded text-[18px]">logout</span>
                    </button>
                  </div>

                  <div className={`${glassClass} rounded-[24px] overflow-hidden shadow-sm p-2.5`}>
                    <button onClick={() => { setResetText(''); setResetConfirm(true); }} className="w-full flex justify-between items-center bg-expense/10 text-expense p-3.5 rounded-[16px]">
                      <div className="flex items-center gap-2.5"><span className="material-symbols-rounded text-[18px]">warning</span><span className="font-bold text-[13px]">{t.resetAll}</span></div>
                    </button>
                  </div>
                </div>
              )}
            </div>

            <div className={`fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] max-w-[390px] ${glassClass} rounded-[28px] py-3.5 px-6 flex justify-around items-center z-30 border border-white/40 shadow-[0_15px_35px_rgba(0,0,0,0.15)]`}>
              <NavBtn icon="space_dashboard" label="Home" active={view === 'Overview'} onClick={() => setView('Overview')} />
              <NavBtn icon="pie_chart" label="Report" active={view === 'Report'} onClick={() => setView('Report')} />

              <div className="relative -top-6 z-10">
                <button onClick={() => { setTxPrefill(null); setModal('Transaction'); }} className="w-[56px] h-[56px] bg-gradient-to-tr from-accent to-[#5AC8FA] rounded-[20px] flex items-center justify-center text-white shadow-[0_10px_24px_rgba(0,122,255,0.4)] hover:scale-105 active:scale-95 transition-all rotate-45 hover:rotate-90 duration-300">
                  <span className="material-symbols-rounded text-[26px] font-bold -rotate-45 hover:-rotate-90 duration-300">add</span>
                </button>
              </div>

              <NavBtn icon="target" label="Planning" active={view === 'Planning'} onClick={() => setView('Planning')} />
              <NavBtn icon="settings" label="Settings" active={view === 'Settings'} onClick={() => setView('Settings')} />
            </div>

            {!loaded && (
              <div className="absolute inset-0 z-[80] flex flex-col items-center justify-center gap-3 bg-[#F5F5F7] dark:bg-[#1C1C1E]">
                {syncError ? (
                  <>
                    <span className="material-symbols-rounded text-[40px] text-expense">cloud_off</span>
                    <p className="text-[13px] font-bold text-center px-8">{t.syncFail}</p>
                    <p className="text-[11px] opacity-60 text-center px-8 break-words">{syncError}</p>
                    <button onClick={fetchAll} className="mt-2 px-5 py-2.5 bg-accent text-white rounded-[14px] font-bold text-[13px]">{t.retry}</button>
                  </>
                ) : (
                  <>
                    <div className="w-10 h-10 border-4 border-accent/20 border-t-accent rounded-full animate-spin"></div>
                    <p className="text-[12px] font-bold opacity-60">{t.loading}</p>
                  </>
                )}
              </div>
            )}

            {pendingUser && (
              <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-[70] flex items-center justify-center p-4">
                <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full max-w-[300px] rounded-[28px] p-6 shadow-2xl text-center`}>
                  <div className="w-16 h-16 bg-accent/10 text-accent rounded-full flex items-center justify-center mx-auto mb-4 text-[32px]">{pendingUser.avatar}</div>
                  <h3 className="text-[18px] font-extrabold mb-1.5">{t.switchProfile}</h3>
                  <p className="text-[12px] opacity-70 mb-6">{t.confirmSwitch} <strong>{pendingUser.name}</strong>?</p>
                  <div className="flex gap-2.5">
                    <button onClick={() => setPendingUser(null)} className="flex-1 py-3 bg-black/5 dark:bg-white/10 rounded-[16px] font-bold text-[13px]">{t.cancel}</button>
                    <button onClick={() => { setActiveUser(pendingUser); localStorage.setItem('ourfin_active_user', JSON.stringify(pendingUser)); setPendingUser(null); }} className="flex-1 py-3 bg-accent text-white rounded-[16px] font-bold text-[13px]">OK</button>
                  </div>
                </div>
              </div>
            )}

            {resetConfirm && (
              <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-[70] flex items-center justify-center p-4">
                <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full max-w-[300px] rounded-[28px] p-6 shadow-2xl text-center`}>
                  <div className="w-16 h-16 bg-expense/10 text-expense rounded-full flex items-center justify-center mx-auto mb-4"><span className="material-symbols-rounded text-[30px]">warning</span></div>
                  <h3 className="text-[18px] font-extrabold mb-1.5">{t.resetAll}</h3>
                  <p className="text-[12px] opacity-70 mb-4">{t.confirmReset}</p>
                  <input value={resetText} onChange={e => setResetText(e.target.value)} placeholder={t.typeReset} className={`w-full mb-4 ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[12px] p-3 text-center text-[13px] font-bold outline-none`} />
                  <div className="flex gap-2.5">
                    <button onClick={() => setResetConfirm(false)} className="flex-1 py-3 bg-black/5 dark:bg-white/10 rounded-[16px] font-bold text-[13px]">{t.cancel}</button>
                    <button disabled={resetText !== 'RESET'} onClick={resetAllDataCloud} className={`flex-1 py-3 bg-expense text-white rounded-[16px] font-bold text-[13px] ${resetText !== 'RESET' ? 'opacity-40' : ''}`}>Reset Total</button>
                  </div>
                </div>
              </div>
            )}

            {modal === 'ManageAccounts' && (
              <ManageAccountsModal isDark={isDark} t={t} accounts={accounts} onClose={() => setModal(null)} onSave={async (accs) => { if (await saveCloudSettings('accounts', accs)) setModal(null); }} />
            )}

            {modal === 'AddPlan' && (
              <AddPlanModal isDark={isDark} t={t} planTab={planTab} expenseCats={expenseCats} onClose={() => setModal(null)} onSave={async (data) => {
                let ok = false;
                if (planTab === 'Budget') ok = await saveCloudSettings('budgets', [...budgets, { id: 'b' + Date.now(), category: data.name, limit: data.val, icon: 'category' }]);
                if (planTab === 'Goals') ok = await saveCloudSettings('goals', [...goals, { id: 'g' + Date.now(), name: data.name, target: data.val, icon: 'shield' }]);
                if (planTab === 'Bills') ok = await saveCloudSettings('bills', [...bills, { id: 'bl' + Date.now(), name: data.name, amount: data.val, icon: 'receipt_long' }]);
                if (planTab === 'Investasi') ok = await saveCloudSettings('investments', [...investments, { id: 'i' + Date.now(), name: data.name, type: data.subType, icon: 'trending_up', mockReturnPct: data.val }]);
                if (ok) setModal(null);
              }} />
            )}

            {modal === 'ManageCategories' && (
              <ManageCategoriesModal isDark={isDark} t={t} incomeCats={incomeCats} expenseCats={expenseCats} onClose={() => setModal(null)} onSave={async (inc, exp) => {
                const ok1 = await saveCloudSettings('incomeCats', inc);
                const ok2 = await saveCloudSettings('expenseCats', exp);
                if (ok1 && ok2) setModal(null);
              }} />
            )}

            {showAllActivity && (
              <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
                <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full max-w-[360px] max-h-[85%] rounded-[32px] p-6 shadow-2xl flex flex-col`}>
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-[18px] font-extrabold">{t.allActivity}</h2>
                    <button onClick={() => setShowAllActivity(false)} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
                  </div>
                  <div className="flex-1 overflow-y-auto no-scrollbar space-y-2.5">
                    {sortedTx.length === 0 ? <p className="text-center opacity-50 py-12 text-[12px]">{t.noHistory}</p> :
                      sortedTx.map(tx => <DetailRow key={tx.id} tx={tx} onDelete={() => deleteTransactionFromCloud(tx.id)} />)
                    }
                  </div>
                </div>
              </div>
            )}

            {detailData && (
              <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
                <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full max-w-[340px] max-h-[85%] rounded-[32px] p-6 shadow-2xl flex flex-col`}>
                  <div className="flex justify-between items-center mb-5">
                    <h2 className="text-[18px] font-extrabold truncate max-w-[75%]">{detailData.title}</h2>
                    <button onClick={() => setDetailData(null)} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
                  </div>
                  <div className="flex-1 overflow-y-auto no-scrollbar space-y-2.5">
                    {detailData.txs.length === 0 && <p className="text-center opacity-50 py-8 text-[12px]">{t.noHistory}</p>}
                    {detailData.txs.map(tx => (
                      <DetailRow key={tx.id} tx={tx}
                        onDelete={detailData.type === 'Detail Transaksi' ? async () => { if (await deleteTransactionFromCloud(tx.id)) setDetailData(null); } : null} />
                    ))}
                  </div>
                  {detailData.type !== 'Detail Transaksi' && (
                    <button onClick={async () => {
                      if (!window.confirm(t.confirmDeletePlan)) return;
                      let ok = false;
                      if (detailData.type === 'Budget') ok = await saveCloudSettings('budgets', budgets.filter(b => b.id !== detailData.item.id));
                      if (detailData.type === 'Goal') ok = await saveCloudSettings('goals', goals.filter(g => g.id !== detailData.item.id));
                      if (detailData.type === 'Bill') ok = await saveCloudSettings('bills', bills.filter(bl => bl.id !== detailData.item.id));
                      if (detailData.type === 'Investasi') ok = await saveCloudSettings('investments', investments.filter(i => i.id !== detailData.item.id));
                      if (ok) setDetailData(null);
                    }} className="w-full bg-expense/10 text-expense font-extrabold text-[13px] py-3.5 rounded-[16px] mt-5">{t.delete} {detailData.type}</button>
                  )}
                </div>
              </div>
            )}

            {(modal === 'Transaction' || txPrefill) && (
              <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-[60] flex items-end">
                <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full rounded-t-[36px] p-6 pb-10 shadow-2xl`}>
                  <FormTransaction
                    t={t} lang={lang} isDark={isDark} accounts={calculatedAccounts} incomeCats={incomeCats} expenseCats={expenseCats} goals={goals} bills={bills} investments={investments} prefill={txPrefill}
                    onClose={() => { setModal(null); setTxPrefill(null); }}
                    onSave={async (tx) => {
                      const ok = await addTransactionToCloud({ ...tx, date: todayStr(), creator: activeUser.name, createdAt: Date.now() });
                      if (ok) { setModal(null); setTxPrefill(null); }
                      return ok;
                    }}
                  />
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    function NavBtn({ icon, label, active, onClick }) {
      return (
        <div onClick={onClick} className={`flex flex-col items-center cursor-pointer w-[50px] transition-all duration-300 relative z-10 ${active ? 'text-accent font-bold scale-105' : 'opacity-40 hover:opacity-100'}`}>
          <span className={`material-symbols-rounded text-[24px] mb-0.5 ${active ? 'fill-current' : ''}`}>{icon}</span>
          <span className="text-[9px] font-bold tracking-widest">{label}</span>
        </div>
      );
    }

    function ManageAccountsModal({ isDark, t, accounts, onClose, onSave }) {
      const [localAccs, setLocalAccs] = useState([...accounts]);
      const [newName, setNewName] = useState('');
      const [newType, setNewType] = useState('Bank');
      const [saving, setSaving] = useState(false);

      const getIcon = (type) => {
        if (type === 'Bank') return 'account_balance';
        if (type === 'E-Wallet') return 'account_balance_wallet';
        return 'payments';
      };

      const handleAdd = () => {
        if (!newName.trim()) return;
        setLocalAccs([...localAccs, { id: 'a' + Date.now(), name: newName.trim(), type: newType, owner: 'Pribadi', icon: getIcon(newType) }]);
        setNewName('');
      };

      return (
        <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full max-w-[340px] max-h-[85%] rounded-[32px] p-6 shadow-2xl flex flex-col`}>
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-[18px] font-extrabold">{t.manageWallet}</h2>
              <button onClick={onClose} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
            </div>

            <div className="flex gap-2 mb-4">
              <select value={newType} onChange={e => setNewType(e.target.value)} className={`w-[90px] ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[12px] px-2 text-[11px] font-bold outline-none`}>
                <option value="Bank">Bank</option>
                <option value="E-Wallet">E-Wallet</option>
                <option value="Cash">Cash</option>
              </select>
              <input type="text" value={newName} onChange={e => setNewName(e.target.value)} placeholder="Nama Dompet..." className={`flex-1 ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[12px] px-3.5 text-xs font-bold outline-none`} />
              <button onClick={handleAdd} className="bg-accent text-white px-3 py-2 rounded-[12px] font-bold text-sm">+</button>
            </div>

            <div className="flex-1 overflow-y-auto no-scrollbar space-y-2">
              {localAccs.map(acc => (
                <div key={acc.id} className="p-3 bg-black/5 dark:bg-white/5 rounded-[14px] flex items-center justify-between gap-2">
                  <div className="flex items-center gap-3 flex-1">
                    <span className="material-symbols-rounded text-accent bg-accent/10 p-2 rounded-[10px] text-[16px]">{acc.icon}</span>
                    <input type="text" value={acc.name} onChange={e => setLocalAccs(localAccs.map(a => a.id === acc.id ? { ...a, name: e.target.value } : a))} className="w-full bg-transparent font-bold text-[13px] outline-none" />
                  </div>
                  <button onClick={() => { if (window.confirm(t.confirmDeleteWallet)) setLocalAccs(localAccs.filter(a => a.id !== acc.id)); }} className="text-expense p-1.5 hover:bg-expense/10 rounded-lg transition"><span className="material-symbols-rounded text-[16px]">delete</span></button>
                </div>
              ))}
              {localAccs.length === 0 && <p className="text-center opacity-50 py-4 text-[12px] italic">Belum ada dompet.</p>}
            </div>
            <button disabled={saving} onClick={async () => { setSaving(true); await onSave(localAccs); setSaving(false); }} className={`w-full bg-accent text-white font-extrabold text-[14px] py-3.5 rounded-[16px] mt-5 ${saving ? 'opacity-50' : ''}`}>{saving ? '...' : t.save}</button>
          </div>
        </div>
      );
    }

    function AddPlanModal({ isDark, t, planTab, expenseCats, onClose, onSave }) {
      const [name, setName] = useState(planTab === 'Budget' ? (expenseCats[0] || '') : '');
      const [subType, setSubType] = useState('Reksa Dana');
      const [val, setVal] = useState('');
      const [displayVal, setDisplayVal] = useState('');
      const inputClass = `w-full ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[16px] p-3.5 text-[14px] font-bold outline-none appearance-none`;

      return (
        <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-end">
          <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full rounded-t-[36px] p-6 pb-10 shadow-2xl`}>
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-[18px] font-extrabold">Add {planTab}</h2>
              <button onClick={onClose} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
            </div>
            <div className="space-y-3.5">
              {planTab === 'Budget' ? (
                <select value={name} onChange={e => setName(e.target.value)} className={inputClass}>
                  {expenseCats.map(c => <option key={c} value={c} className="text-black">{c}</option>)}
                </select>
              ) : (
                <input type="text" placeholder={planTab === 'Investasi' ? 'Nama Portofolio (cth: Tino)' : 'Name'} value={name} onChange={e => setName(e.target.value)} className={inputClass} />
              )}
              {planTab === 'Investasi' && (
                <select value={subType} onChange={e => setSubType(e.target.value)} className={inputClass}>
                  <option value="Reksa Dana">Reksa Dana</option>
                  <option value="Saham">Saham</option>
                  <option value="Obligasi">Obligasi / SBN</option>
                </select>
              )}
              <input type="text" inputMode={planTab === 'Investasi' ? 'decimal' : 'numeric'} placeholder={planTab === 'Investasi' ? 'Estimasi Return (%)' : 'Amount (Rp)'} value={planTab === 'Investasi' ? val : displayVal} onChange={planTab === 'Investasi' ? (e) => setVal(e.target.value.replace(',', '.')) : (e) => { const clean = e.target.value.replace(/\D/g, ''); setVal(clean); setDisplayVal(formatNumberInput(clean)); }} className={inputClass} />
              <button onClick={() => { const num = parseFloat(val); if (name.trim() && !isNaN(num)) onSave({ name: name.trim(), subType, val: num }); }} className="w-full bg-accent text-white font-extrabold text-[14px] py-3.5 rounded-[16px] mt-3">{t.save}</button>
            </div>
          </div>
        </div>
      );
    }

    function ManageCategoriesModal({ isDark, t, incomeCats, expenseCats, onClose, onSave }) {
      const [inc, setInc] = useState([...incomeCats]);
      const [exp, setExp] = useState([...expenseCats]);
      const [newCat, setNewCat] = useState('');
      const [type, setType] = useState('Expense');

      const addCat = () => {
        const c = newCat.trim();
        if (!c) return;
        if (type === 'Expense') { if (!exp.includes(c)) setExp([...exp, c]); }
        else { if (!inc.includes(c)) setInc([...inc, c]); }
        setNewCat('');
      };

      return (
        <div className="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className={`${isDark ? 'bg-[#1C1C1E]' : 'bg-[#ffffff]'} w-full max-w-[340px] max-h-[85%] rounded-[32px] p-6 shadow-2xl flex flex-col`}>
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-[18px] font-extrabold">{t.manageCat}</h2>
              <button onClick={onClose} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
            </div>
            <div className="flex gap-2 mb-3.5">
              <button onClick={() => setType('Expense')} className={`flex-1 py-2 rounded-[12px] text-xs font-bold ${type === 'Expense' ? 'bg-expense text-white' : 'bg-black/5 dark:bg-white/5'}`}>{t.expense}</button>
              <button onClick={() => setType('Income')} className={`flex-1 py-2 rounded-[12px] text-xs font-bold ${type === 'Income' ? 'bg-income text-white' : 'bg-black/5 dark:bg-white/5'}`}>{t.income}</button>
            </div>
            <div className="flex gap-2 mb-3.5">
              <input type="text" value={newCat} onChange={e => setNewCat(e.target.value)} placeholder="Kategori baru..." className={`flex-1 ${isDark ? 'bg-black/20' : 'bg-[#F2F2F7]'} rounded-[12px] px-3.5 text-xs font-bold outline-none`} />
              <button onClick={addCat} className="bg-accent text-white px-3.5 py-2.5 rounded-[12px] font-bold text-sm">+</button>
            </div>
            <div className="flex-1 overflow-y-auto no-scrollbar space-y-2">
              {(type === 'Expense' ? exp : inc).map(c => (
                <div key={c} className="p-3 bg-black/5 dark:bg-white/5 rounded-[14px] flex justify-between items-center">
                  <span className="font-bold text-[13px]">{c}</span>
                  <button onClick={() => type === 'Expense' ? setExp(exp.filter(x => x !== c)) : setInc(inc.filter(x => x !== c))} className="text-expense"><span className="material-symbols-rounded text-[16px]">delete</span></button>
                </div>
              ))}
            </div>
            <button onClick={() => onSave(inc, exp)} className="w-full bg-accent text-white font-extrabold text-[14px] py-3.5 rounded-[16px] mt-5">{t.save}</button>
          </div>
        </div>
      );
    }

    function FormTransaction({ t, lang, isDark, accounts, incomeCats, expenseCats, goals, bills, investments, prefill, onClose, onSave }) {
      const optionsFor = (tp) => {
        if (tp === 'Expense') return expenseCats.map(c => ({ value: c, label: c }));
        if (tp === 'Income') return incomeCats.map(c => ({ value: c, label: c }));
        if (tp === 'Goal') return goals.map(g => ({ value: g.id, label: g.name }));
        if (tp === 'Bill') return bills.map(b => ({ value: b.id, label: b.name }));
        if (tp === 'Investasi') return investments.map(i => ({ value: i.id, label: i.name }));
        return [];
      };

      const initialType = prefill?.type || 'Expense';
      const initialRaw = prefill?.amount ? String(prefill.amount) : '';
      const [type, setType] = useState(initialType);
      const [rawAmount, setRawAmount] = useState(initialRaw);
      const [displayAmount, setDisplayAmount] = useState(formatNumberInput(initialRaw));
      const [accountId, setAccountId] = useState(accounts[0]?.id || '');
      const [toAccountId, setToAccountId] = useState(accounts[1]?.id || '');
      const [selection, setSelection] = useState(() => prefill?.goalId || prefill?.billId || prefill?.investmentId || prefill?.category || optionsFor(initialType)[0]?.value || '');
      const [desc, setDesc] = useState(prefill?.desc || '');
      const [saving, setSaving] = useState(false);

      const options = optionsFor(type);

      // Pastikan kategori selalu valid untuk jenis transaksi yang dipilih
      useEffect(() => {
        if (type !== 'Transfer' && options.length && !options.some(o => o.value === selection)) setSelection(options[0].value);
      }, [type, options.length]);

      const changeType = (tp) => {
        setType(tp);
        if (tp !== 'Transfer') setSelection(optionsFor(tp)[0]?.value || '');
      };

      const handleAmountChange = (e) => {
        const clean = e.target.value.replace(/\D/g, '');
        setRawAmount(clean);
        setDisplayAmount(formatNumberInput(clean));
      };

      const submit = async () => {
        if (saving) return;
        if (accounts.length === 0) { alert(t.noWalletAlert); return; }

        const num = parseFloat(rawAmount) || 0;
        if (num <= 0) return;

        const tx = { type, amount: num, accountId, desc, icon: txMeta(type).icon };

        if (type === 'Transfer') {
          if (accounts.length < 2) { alert(t.needTwoWallets); return; }
          if (!toAccountId || toAccountId === accountId) { alert(t.sameWallet); return; }
          const src = accounts.find(a => a.id === accountId);
          if (src && num > src.balance && !window.confirm(t.lowBalance)) return;
          tx.toAccountId = toAccountId;
          tx.category = 'Transfer';
        } else {
          if (!selection) { alert(t.chooseCat); return; }
          tx.category = options.find(o => o.value === selection)?.label || selection;
          if (type === 'Goal') tx.goalId = selection;
          if (type === 'Bill') tx.billId = selection;
          if (type === 'Investasi') tx.investmentId = selection;
        }

        setSaving(true);
        await onSave(tx);
        setSaving(false);
      };

      const inputClass = `w-full ${isDark ? 'bg-black/20 text-white' : 'bg-[#F2F2F7] text-[#1C1C1E]'} border-none rounded-[16px] p-3.5 text-[13px] font-bold outline-none appearance-none`;
      const walletOptions = accounts.map(a => <option key={a.id} value={a.id} className="text-black">{a.name} · {formatRp(a.balance)}</option>);

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center mb-1">
            <h2 className="text-[20px] font-extrabold">{t.addTx}</h2>
            <button onClick={onClose} className="bg-black/5 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><span className="material-symbols-rounded text-[16px]">close</span></button>
          </div>

          <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            {[
              { id: 'Expense', label: t.expense, color: 'bg-expense' },
              { id: 'Income', label: t.income, color: 'bg-income' },
              { id: 'Transfer', label: t.transfer, color: 'bg-transfer' },
              { id: 'Goal', label: 'Goal', color: 'bg-accent' },
              { id: 'Bill', label: 'Bills', color: 'bg-warning' },
              { id: 'Investasi', label: 'Invest', color: 'bg-invest' }
            ].map(tb => (
              <button key={tb.id} onClick={() => changeType(tb.id)} className={`px-3 py-2 rounded-[12px] text-[10px] font-bold whitespace-nowrap transition-all ${type === tb.id ? `${tb.color} text-white shadow-md` : 'bg-black/5 dark:bg-white/5 opacity-60'}`}>
                {tb.label}
              </button>
            ))}
          </div>

          <div className="relative">
            <span className="absolute left-4 top-1/2 -translate-y-1/2 font-extrabold text-[20px] opacity-40">Rp</span>
            <input type="text" inputMode="numeric" placeholder="0" value={displayAmount} onChange={handleAmountChange} className={`${inputClass} pl-12 text-[24px] py-4 font-extrabold`} />
          </div>

          {type === 'Transfer' ? (
            <div className="flex items-end gap-2">
              <div className="flex-1 min-w-0">
                <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.from}</label>
                <select value={accountId} onChange={e => setAccountId(e.target.value)} className={inputClass}>{walletOptions}</select>
              </div>
              <span className="material-symbols-rounded text-transfer pb-3.5">arrow_forward</span>
              <div className="flex-1 min-w-0">
                <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.to}</label>
                <select value={toAccountId} onChange={e => setToAccountId(e.target.value)} className={inputClass}>{walletOptions}</select>
              </div>
            </div>
          ) : (
            <div className="flex gap-3">
              <div className="flex-1 min-w-0">
                <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.wallet}</label>
                <select value={accountId} onChange={e => setAccountId(e.target.value)} className={inputClass}>
                  {accounts.length === 0 && <option value="">Belum Ada Dompet</option>}
                  {walletOptions}
                </select>
              </div>
              <div className="flex-1 min-w-0">
                <label className="text-[9px] font-bold uppercase opacity-50 mb-1 block">{t.category}</label>
                <select value={selection} onChange={e => setSelection(e.target.value)} className={inputClass}>
                  {options.length === 0 && <option value="">—</option>}
